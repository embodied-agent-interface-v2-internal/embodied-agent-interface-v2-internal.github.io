name: Deploy

# Builds the public site and publishes it on GitHub Pages, at
# https://embodied-agent-interface-v2-internal.github.io/ (an <org>.github.io
# repository: the site sits at the domain root). Runs on every push to main, or
# by hand from the Actions tab. See HANDOFF.md, "Publishing".
#
# `make public` is the public build (scripts/sitemode.py, data/public.yml):
# read-only, only what is committed (the agent runs come from the published
# snapshot, data/published_runs/; their media are hosted apart), links and size
# checked. CI and a local `make public` build exactly the same.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# One deploy at a time; a newer push waits instead of cancelling a deploy half-way.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Silence the MkDocs 2.0 advisories; the two packages that print them
  # read different variables. Informational only — see HANDOFF.md.
  NO_MKDOCS_2_WARNING: "true"
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:
  build:
    name: Build the public site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read          # configure-pages reads the site's address
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # The same .venv that `make install` creates, so the Makefile runs unchanged.
      - name: Install toolchain
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v6

      - name: Validate task pages
        run: .venv/bin/python scripts/validate.py --quiet

      - name: Build the public site (links and size checked)
        run: make public
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write         # publish the artifact
      id-token: write      # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
