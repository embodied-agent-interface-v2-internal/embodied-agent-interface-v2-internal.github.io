# RoboPaint's agent runs. Owned by the benchmark's owner, curated by hand like everything in state/.
# Format and field meanings: docs/contributing/registering-runs.md (and the header of state/runs/behavior-1k.yml).

default: codex-gpt6_luna-xhigh
# task id <family>_<target> -> our task directory robopaint-<family>-<target>-i00
task_dir: "robopaint-{task_dashed}-i00"

# The grader's continuous scores beside success (user 2026-09-28: "IoU 也可以作为一个 metric，不一定非要用 success"):
# reward.json keys, shown as columns, sorts and run summaries on the Runs pages. final_reward is each task's continuous
# score (its upstream continuous_score), so what it measures depends on the family: F1 of the painted strokes for a
# line drawing, IoU for calligraphy and lettering, 1 - mean ΔE / 20 for a painting. The two chamfer distances (line
# drawings only) are in millimetres, lower is better.
metrics:
- {key: final_reward, label: Final reward, format: ".3f", help: "each task's continuous score, which depends on its family: F1 for a line drawing, IoU for calligraphy and lettering, 1 - mean ΔE / 20 for a painting"}
- {key: iou, label: IoU, format: ".3f"}
- {key: precision, label: Precision, format: ".3f"}
- {key: recall, label: Recall, format: ".3f"}
- {key: min_color_recall, label: Min colour recall, format: ".3f"}
- {key: chamfer_paint_to_target_mm, label: "Chamfer paint→target", format: ".2f", unit: mm, better: lower, summary: median}
- {key: chamfer_target_to_paint_mm, label: "Chamfer target→paint", format: ".2f", unit: mm, better: lower, summary: median}
- {key: ssim_blur, label: SSIM (blurred), format: ".3f"}

# final_reward per family (2026-09-28, before the sweep went public): the Runs page shows success and its plain mean
# per task family and mode, naming each family's metric from its tasks' continuous_score; the home table shows its plain
# mean as "mean final reward", with a note that the metric depends on the family.
per_family: {key: final_reward, label: final reward}

runs:
  codex-gpt6_luna-xhigh:
    # 2026-09-28 ~02:00: the renamed benchmark's first sweep (picture-only agent side, the scoring sidecar), the 9
    # line drawings x both modes on our RoboPaint workstation. The batches of the
    # benchmark's maniskill-paint days (paint-lunaxh-0927 with vector targets, paint-rgb-lunaxh-0927) are dropped from
    # the site (user: only this run); their Harbor jobs stay on that machine as the record.
    batch: robopaint-lunaxh-0928
    # 2026-09-28 07:45, user: the sweep of the benchmark proper (kaishu, xingshu, lettering, acrylic and oil; no line
    # drawing), on our workstations. No task is in both batches, so each task's jobs come from the one that has them.
    # robopaint-lunaxh-rerun-0928 (ws3): one rerun, xingshu_yong unlimited. Its first trial ended at 18 min when the
    # ChatGPT backend rejected a Codex request, not the agent's doing; the rerun supersedes it, as earlier reruns did.
    rerun_batches: [robopaint-lunaxh-0928b, robopaint-lunaxh-rerun-0928]
    followups:  # arranged for one trial each; the note goes away once another trial replaces it
    - {task: xingshu_yong, mode: unlimited, trial: robopaint-xingshu-yong-i00__GkDcjZc, note: "the ChatGPT backend
        rejected a Codex request at 18 min (HTTP 400 \"prompt_cache_retention is not supported on this model\"), not the
        agent's doing; rerun on ws3 in robopaint-lunaxh-rerun-0928"}
    - {task: xingshu_zhi, mode: unlimited, trial: robopaint-xingshu-zhi-i00__NGSF7kr, note: "never reached the agent: the
        agent install's apt-get update failed (exit 100) while NVIDIA's CUDA apt repo was mid-sync; rerun in
        robopaint-lunaxh-rerun-0928"}
    # Graded as they are, not rerun (2026-09-28): the agent's own kill command also ended the Codex process.
    notes:  # on one trial each, graded as it is: nothing arranged
    - {task: kaishu_fu, mode: unlimited, trial: robopaint-kaishu-fu-i00__YTwmo84, note: "the agent's own `pkill -f
        '/app/output/gen.py'` also matched the Codex process, whose command line carries the instruction, and ended the
        agent at 17 min"}
    - {task: xingshu_tong, mode: limited, trial: robopaint-xingshu-tong-i00-limit__JLjVzXW, note: "the agent's own Python
        kill loop (SIGINT to every process whose command line holds '/app/output/gen.py' and 'python') also hit the Codex
        process, whose command line carries the instruction, and ended the agent at 45 min"}
    # 2026-09-28 20:15, user: counted as it ran, with this note.
    - {task: lettering_moon, mode: limited, trial: robopaint-lettering-moon-i00-lim__SKuF3U3, note: "the service's
        time_left_s overstated the remaining time by 30 min (RCB_WALL_CLOCK_S 7200 vs the 5400 s budget); the agent hit
        the 90-min limit; fixed in the next task version"}
    # RoboPaint's pages name no source repository (owner, 2026-09-28: "robopaint上不要写那个仓库"), so its Run details
    # word the harness without the repository and commit that data/agents/ names.
    harness: >-
      Codex CLI 0.157.0 as our Harbor agent CodexChatGPT: Codex with our model gateway pointed at ChatGPT's backend
