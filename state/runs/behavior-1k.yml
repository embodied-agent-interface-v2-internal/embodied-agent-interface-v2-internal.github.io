# BEHAVIOR-1K's agent runs. Owned by the benchmark's owner, curated by hand like everything in state/.
# Format: docs/contributing/registering-runs.md. scripts/import_runs.py reads it to know which Harbor batches hold
# which run of which task; the site greys out every task that is removed from a run and says why.
#
#   default    the run the task list, the task pages and data/runs/status.json show first
#   task_dir   the task's directory in robot_coding_bench: Harbor names a job <batch>-<mode>-<task dir>
#   runs       run id (data/agents/<id>.yml) -> this benchmark's part in it:
#     batch          the Harbor batch (robot_coding_bench scripts/run_agent_batch.sh)
#     rerun_batches  later batches; for a task and mode the last batch that has the job wins, the earlier one
#                    stays as history (its log page moves to <mode>-prev)
#     rerun_all      true: the last rerun batch reruns every task and mode; until it starts a job, that job reads
#                    "rerun queued" and the earlier result stays as history
#     tasks          task ids in the run; each runs once per mode
#     removed        task id -> why it is not in the run (shown grey)
#     others         why every task in neither list is not in it (shown in colour: merely not built for it)
#     followups      {task, mode, trial, note}: what is arranged for one trial; the note goes away by itself once
#                    another trial replaces that one
#     closed         why the run is over; its never-started jobs then read "not run" instead of "queued"

default: codex-0.157-gpt6luna-xhigh-cgpt
task_dir: "behavior-{task_dashed}-i00"
# the partial credit beside success: the 2026 challenge's q_score (every other benchmark: the grader's final_reward)
