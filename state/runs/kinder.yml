# KinDER's agent runs. Owned by the benchmark's owner, curated by hand like everything in state/.
# Format and field meanings: docs/contributing/registering-runs.md (and the header of state/runs/behavior-1k.yml).

default: codex-gpt6_luna-medium-openrouter
# task id <family with underscores> -> our task directory kinder-<family>-i00 (protocol v1.0: its -privileged twin is
# the unlimited mode, its -standard twin the limited mode)
task_dir: "kinder-{task_dashed}-i00"
# No partial credit beside success: KinDER's goal check passes or fails, and its reward.json has no progress key.
progress: none

# Since 2026-10-04 the benchmark is these 4 families (since 2026-10-06 for the reason that they have the most task
# objects; the other 6 are `excluded` in state/tasks/kinder.yml), and GPT-6 Luna's batch kinder-luna-1006 on them is its
# run: robot_coding_bench's task set of that day (protocol v1.0.1;
# limited = the standard twin on eai-standard/2.1 in its standard configuration: one episode, no reset, the robot's own
# base and wrist cameras with wrist depth), image 0.1.6 as published, 60 minutes a mode, effort medium, one attempt per
# task and mode, started by run_agent_batch.sh. GPT-6.1 Sol's run stays beside it as history (the default before
# 2026-10-04); robot_coding_bench's oracle_evidence cites Luna's trials. The rest describes the runs before then.
# Image 0.1.6, 60 minutes a mode, effort medium, the agent reaching the model APIs only. Limited: the standard config,
# 50 resets, the robot's own base and wrist cameras (wrist depth, no room camera), and spec() gives the gripper's grasp
# point (`end_effector`); the PyBullet robot reports a move it refuses as `blocked`. One attempt per task and mode:
# limited 2026-09-30, unlimited 2026-10-01. The Harbor jobs predate run_agent_batch.sh's names
# (kinder-full-<family>-codex-gpt61sol-medium-60min, kinder-limited-<family>-...-60min-reset50-depth-ee); the batch name
# below links to them on the machine that ran them. Both are on the tasks before protocol v1.0 (limited mode 1.1); only
# Luna's rerun batches are on v1.0.
runs:
  codex-gpt6_1_sol-medium:
    batch: kinder-sol61-0930
    tasks:
    - tossing
    - balance_beam
    - dynamo
    - sweep_into_drawer
    - scoop_pour
    - shelf
    - constrained_cupboard
    - sweep_simple
    - sort_blocks
    - obstruction_3d
    - packing_3d
  codex-gpt6_luna-medium-openrouter:
    batch: kinder-luna-0930
    # Protocol v1.0 (robot_coding_bench main d1b93b49, 2026-10-01): the standard twins with 50 resets (10 families; dynamo
    # has a reference solution and was not swept) and dynamo privileged, on Harbor's codex agent (Codex CLI 0.159.2).
    # Each replaces the task's earlier trial, which stays as its history. The v1.0 sweep without resets (0/10) is not
    # on this site. kinder-luna-1004 (2026-10-04) and kinder-luna-1006 (2026-10-06): the 4 families of the benchmark,
    # both modes, limited without resets (header above).
    rerun_batches: [kinder-luna-v1-1001, kinder-luna-1004, kinder-luna-1006]
    harness: >-
      Before v1.0: Codex CLI 0.158.0 (the first six unlimited runs), 0.159.0 (the other five) and 0.159.2 (limited) as
      harbor_agents.codex_openrouter:CodexOpenRouter, Codex over OpenRouter with web search off, without the model
      gateway; in limited mode the adapter ends the trial when the session ends (harbor_agents/limited.py). On v1.0:
      Harbor's codex agent, Codex CLI 0.159.2, web search disabled (scripts/kinder/configs/codex-openrouter.yaml)
    tasks:
    - tossing
    - balance_beam
    - dynamo
    - sweep_into_drawer
    - scoop_pour
    - shelf
    - constrained_cupboard
    - sweep_simple
    - sort_blocks
    - obstruction_3d
    - packing_3d
  codex-gpt6_luna-xhigh:
    batch: kinder-bel-luna-xh-1005
    tasks:
    - balance_beam
    - constrained_cupboard
    - dynamo
    - obstruction_3d
    - packing_3d
    - scoop_pour
    - shelf
    - sort_blocks
    - sweep_into_drawer
    - sweep_simple
    - tossing
    others: 'not in the batch evaluation of 2026-10-03 to 10-05 (kinder-bel-luna-xh-1005)'
  codex-gpt6_astra-high:
    batch: kinder-bel-astra-hi-1005
    tasks:
    - balance_beam
    - constrained_cupboard
    - obstruction_3d
    - packing_3d
    - scoop_pour
    - shelf
    - sort_blocks
    - sweep_into_drawer
    - sweep_simple
    - tossing
    others: 'not run: the batch evaluation (2026-10-03 to 10-05) gave GPT-6 Astra the tasks GPT-6 Luna failed plus a stratified sample'
    closed: "the batch evaluation of 2026-10-03 to 10-05 is over; GPT-6 Astra ran the tasks and modes GPT-6 Luna failed, plus a stratified sample, so a mode it skipped reads not run"
  codex-gpt6_sol-high:
    batch: kinder-bel-sol-hi-1005
    tasks:
    - balance_beam
    - constrained_cupboard
    - obstruction_3d
    - packing_3d
    - scoop_pour
    - shelf
    - sort_blocks
    - sweep_into_drawer
    - sweep_simple
    - tossing
    others: 'not run (yet): the batch evaluation gave GPT-6 Sol a stratified sample and then the tasks GPT-6 Luna failed; it is still running'
  codex-gpt6_1_sol-high:
    batch: kinder-bel-sol61-hi-1005
    tasks:
    - balance_beam
    - constrained_cupboard
    - obstruction_3d
    - packing_3d
    - scoop_pour
    - shelf
    - sort_blocks
    - sweep_into_drawer
    - sweep_simple
    - tossing
    others: 'not run (yet): the batch evaluation gave GPT-6.1 Sol a stratified sample and then the tasks GPT-6 Luna failed; it is still running'
