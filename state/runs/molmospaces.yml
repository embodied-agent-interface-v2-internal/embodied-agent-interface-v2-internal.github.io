# MolmoSpaces' agent runs. Owned by the benchmark's owner, curated by hand like everything in state/.
# Format and field meanings: docs/contributing/registering-runs.md (and the header of state/runs/behavior-1k.yml).

default: codex-gpt6_luna-medium-openrouter
# task id <family with underscores> -> our task directory molmospaces-<family>-i00 (robot_coding_bench:
# molmospaces-<family>-i00-privileged is the unlimited mode, its -standard twin the limited mode)
task_dir: "molmospaces-{task_dashed}-i00"
# No partial credit beside success: upstream's judge_success() passes or fails, and reward.json has no progress key.
progress: none

# GPT-6 Luna, one attempt per task and mode, 60 minutes a mode: Codex CLI 0.159.2 as Harbor's own codex agent with
# OpenRouter as its own provider, reasoning medium, web search disabled, no model gateway, agent egress allowlisted to
# the model APIs (scripts/molmospaces/configs/codex-openrouter.yaml). molmospaces-luna-1003: all 24 candidates of the
# selection used until 2026-10-06 (three per family), filed under the runner's per-task job names. Since 2026-10-06 each
# family's episode is chosen by rule alone (state/tasks/molmospaces.yml), and each final episode's trials are the last
# of: molmospaces-luna-1006 (all 8 families), molmospaces-luna-1006b (pick, pick-and-place, next-to, colour and
# navigation after the difficulty filters were raised) and molmospaces-luna-1006c (pick and next-to after the naming
# filter). A task's earlier trials stay as its history; those before its final batch ran on its earlier episodes.
runs:
  codex-gpt6_luna-medium-openrouter:
    batch: molmospaces-luna-1003
    harness: Codex CLI 0.159.2 as Harbor's codex agent (OpenRouter as its own provider, no model gateway)
    tasks:
    - pick
    - pick_and_place
    - pick_and_place_next_to
    - pick_and_place_color
    - open
    - close
    - navigate_to
    - open_door
    rerun_batches: [molmospaces-luna-1006, molmospaces-luna-1006b, molmospaces-luna-1006c]
