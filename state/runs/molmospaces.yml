# MolmoSpaces' agent runs. Owned by the benchmark's owner, curated by hand like everything in state/.
# Format and field meanings: docs/contributing/registering-runs.md (and the header of state/runs/behavior-1k.yml).

default: codex-gpt6_luna-medium-openrouter
# task id <family with underscores> -> our task directory molmospaces-<family>-i00 (robot_coding_bench:
# molmospaces-<family>-i00-privileged is the unlimited mode, its -standard twin the limited mode)
task_dir: "molmospaces-{task_dashed}-i00"
# No partial credit beside success: upstream's judge_success() passes or fails, and reward.json has no progress key.
progress: none

# The model run behind the selection (2026-10-03): GPT-6 Luna on all 24 candidate episodes (three per family), one
# attempt per task and mode, 60 minutes a mode; the benchmark keeps one episode per family, and these are its trials.
# Codex CLI 0.159.2 as Harbor's own codex agent with OpenRouter as its own provider, reasoning medium, web search
# disabled, no model gateway, agent egress allowlisted to the model APIs (scripts/molmospaces/configs/
# codex-openrouter.yaml). The candidates ran under their candidate names (e.g. molmospaces-pick-i02); the episodes are
# the ones shipped as -i00. After the run four sentences of the instructions were made clearer (the Franka gripper's
# target at t = 0, the largest valid dt, the navigation distance to the object's position, the tooling's usage log);
# scenes, instances and checks are unchanged. The Harbor jobs ran as one job for all candidates; they are filed here
# under the runner's per-task job names.
runs:
  codex-gpt6_luna-medium-openrouter:
    batch: molmospaces-luna-1003
    harness: Codex CLI 0.159.2 as Harbor's codex agent (OpenRouter as its own provider, no model gateway)
    tasks:
    - pick
    - pick_and_place
    - pick_and_place_next_to
    - pick_and_place_color
    - open
    - close
    - navigate_to
    - open_door
    closed: the selection run of 2026-10-03, run once
