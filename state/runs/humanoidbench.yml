# HumanoidBench's agent runs. Owned by the benchmark's owner, curated by hand like everything in state/.
# Format and field meanings: docs/contributing/registering-runs.md (and the header of state/runs/behavior-1k.yml).

default: codex-gpt6_luna-medium
# task id <category>_<task> -> our task directory humanoidbench-<category>-<task>-i00 (and its -limited twin)
task_dir: "humanoidbench-{task_dashed}-i00"
# No partial credit beside success: HumanoidBench's reward.json has none (its final_reward is the last step's reward,
# not progress; the episode return, on each task's own scale, stays in verifier/diagnostics.json).
progress: none
# The limited mode's resets used, of the 50 our runs allow (reward.json `resets`; the unlimited mode has no count).
metrics:
- {key: resets, label: Resets used, format: ".0f", better: lower}

# Every run here: task text 7 (robot_coding_bench ef883ec: spec() adds the joints' positions, the links' masses and
# centres of mass and the feet's collision boxes), image 0.1.6, 60 minutes a mode, limited with 50 resets, a pelvis
# IMU and the room camera. Their Harbor jobs predate run_agent_batch.sh's names (hb-<mode>-<task>-<agent>-...-text7);
# the batch names below are links to them on the machine that ran them.
runs:
  codex-gpt6_luna-medium:
    batch: hb-luna-0928
    notes:  # on one trial each, graded as it is: nothing arranged
    - {task: manip_push, mode: limited, trial: humanoidbench-manip-push-i00-lim__R6DtjyA, note: "`spec()` placed the
        hand 0.31 m beyond the real one (a massless link's centre of mass; fixed since); the arm poses the agent chose
        with it in its last two episodes never reached the box"}
    tasks:
    - loco_sit_simple
    - loco_walk
    - loco_hurdle
    - loco_balance_simple
    - manip_door
    - manip_powerlift
    - manip_push
    - manip_cube
    - manip_package
    - manip_bookshelf_simple
    - loco_stair
    - loco_balance_hard
    - loco_maze
    - manip_highbar_simple
    - manip_basketball
    - loco_reach
    - loco_sit_hard
    - manip_truck
    - manip_window
    - manip_spoon
    - manip_insert_normal
    - manip_room
    - manip_cabinet
    - manip_kitchen
  claude_code-claude_opus5_5-medium:
    batch: hb-opus-0928
    notes:  # on one trial each, graded as it is: nothing arranged
    - {task: manip_cube, mode: limited, trial: humanoidbench-manip-cube-i00-lim__P9dfBad, note: "the agent ended itself
        at 6 min with 13 of its 50 resets left"}
    - {task: manip_cube, mode: unlimited, trial: humanoidbench-manip-cube-i00__o94E5nq, note: "the agent ended itself at
        17 min, believing its time was nearly up; it never checked the clock"}
    - {task: manip_door, mode: limited, trial: humanoidbench-manip-door-i00-lim__4qvYP8i, note: "`spec()` placed the
        hand 0.31 m beyond the real one (a massless link's centre of mass; fixed since); taking it for the fingertip,
        the agent concluded its arms pass through the door and ended itself at 14 min with 16 resets left"}
    tasks: [loco_walk, loco_sit_hard, manip_door, manip_push, manip_cube]
    others: 'not in this run (the two dearer models ran five tasks, chosen to span locomotion and manipulation, easy
      to hard)'
  codex-gpt6_sol-medium:
    batch: hb-sol-0928
    notes:  # on one trial each, graded as it is: nothing arranged
    - {task: manip_door, mode: limited, trial: humanoidbench-manip-door-i00-lim__BQAugTj, note: "`spec()` placed the
        hand 0.31 m beyond the real one (a massless link's centre of mass; fixed since), and the agent aimed its hand at
        the handle with it"}
    tasks: [loco_walk, loco_sit_hard, manip_door, manip_push, manip_cube]
    others: 'not in this run (the two dearer models ran five tasks, chosen to span locomotion and manipulation, easy
      to hard)'
    closed: 'the OpenRouter credit ran out on 2026-09-28 before the unlimited runs on door, push and cube'
