# RoboPaint-strict's agent runs. Owned by the benchmark's owner, curated by hand like everything in state/.
# Format and field meanings: docs/contributing/registering-runs.md (and the header of state/runs/behavior-1k.yml).

default: codex-gpt6_luna-xhigh
# task id <family>_<target> -> our task directory robopaint-strict-<family>-<target>-i00 (protocol v1.0: its -privileged
# twin is the unlimited mode, its -standard twin the limited mode)
task_dir: "robopaint-strict-{task_dashed}-i00"

# The grader's continuous scores beside success, as on RoboPaint, plus the process rules' own measures. final_reward is
# RoboPaint's continuous score (IoU for writing, 1 - mean ΔE / 20 for a painting), scaled down when a rule fails.
metrics:
- {key: final_reward, label: Final reward, format: ".3f", help: "RoboPaint's continuous score (IoU for calligraphy and lettering, 1 - mean ΔE / 20 for a painting), scaled down when a process rule fails"}
- {key: image_final_reward, label: Picture score, format: ".3f", help: "RoboPaint's continuous score before the process rules"}
- {key: image_success, label: Picture rule, format: ".0f", help: "1 when RoboPaint's picture rule passes, whatever the process rules say"}
- {key: strict_ok, label: Process rules, format: ".0f", help: "1 when the process rules pass"}
- {key: path_mm, label: Path, format: ".0f", unit: mm, summary: median, help: "the brush tip's path pressed on the main sheet with paint"}
- {key: iou, label: IoU, format: ".3f"}
- {key: ssim_L, label: SSIM of L*, format: ".3f"}

# final_reward per family, as on RoboPaint: the Runs page shows success and its plain mean per task family and mode.
per_family: {key: final_reward, label: final reward}

