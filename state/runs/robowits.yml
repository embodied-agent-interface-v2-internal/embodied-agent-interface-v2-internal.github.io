# RoboWits' agent runs. Owned by the benchmark's owner, curated by hand like everything in state/.
# Format and field meanings: docs/contributing/registering-runs.md (and the header of state/runs/behavior-1k.yml).

default: codex-gpt6_luna-xhigh
task_dir: "robowits-{task_dashed}-i00"

runs:
  codex-gpt6_luna-xhigh:
    batch: robowits-lunaxh-0925-2042
    # 2026-09-26, user: the particle-heavy tasks rerun on Genesis' GPU backend (their CPU-backend runs stay in the batch above)
    # 2026-09-27: robowits-lunaxh-rerun-0927 = the four limited runs that collected no result, rerun on the laptop
    # 2026-09-29, user: the limited round on the robot service's rcb-limited/2.2 protocol (28 tasks on the laptop,
    # water_into_mug on ws3) replaces the earlier limited round, which stays as history. rerun-0929: cover_with_lid.
    rerun_batches: [robowits-lunaxh-gpu-0926, robowits-lunaxh-rerun-0927, robowits-lunaxh-limited-0929,
                    robowits-lunaxh-limited-rerun-0929, robowits-bel-luna-xh-1005]
    followups:  # arranged for one trial each; the note goes away once another trial replaces it
    - {task: ball_into_jar, mode: limited, trial: robowits-ball-into-jar-i00-limit__6Bu2BRV, note: "rerun on the laptop, CPU backend as in its unlimited run, with collect waits set from a measured scene build: the old waits (10 / 9 / 20 min) ran out, so no result was collected"}
    - {task: differentiate_cubes, mode: limited, trial: robowits-differentiate-cubes-i00__auecEhM, note: "rerun on the laptop, CPU backend as in its unlimited run, with collect waits set from a measured scene build: the old waits (10 / 9 / 20 min) ran out, so no result was collected"}
    - {task: seal_colander, mode: limited, trial: robowits-seal-colander-i00-limit__DKhVfQk, note: "rerun on the laptop, CPU backend as in its unlimited run, with collect waits set from a measured scene build: the old waits (10 / 9 / 20 min) ran out, so no result was collected"}
    - {task: separate_marbles_and_sand, mode: limited, trial: robowits-separate-marbles-and-sa__HJEPaGs, note: "rerun on the
        laptop GPU (running since 01:22): on ws the robot service died while its 4090 also held two BEHAVIOR sims, so no
        result was collected"}
    # 2 infrastructure failures of the 2.2 round, not counted (2026-09-29): cover_with_lid's first 2 attempts never reached
    # the agent (Harbor's Codex install, apt-get with a 360 s limit, timed out while a bulk copy between two other
    # machines went through the laptop and saturated its WiFi). The second, robowits-cover-with-lid-i00-limi__cuGK2uH,
    # was parked in robot_coding_bench jobs/agents_parked_l22/ (INDEX there), so no host shows it; the third counts. A task
    # keeps one earlier trial as history, so the not-counted XUEzYpg takes that place and the earlier round's limited
    # trial leaves the site; it stays in the raw records.
    - {task: cover_with_lid, mode: limited, trial: robowits-cover-with-lid-i00-limi__XUEzYpg, note: "never reached the agent:
        Harbor's Codex install ran past its 360 s limit (AgentSetupTimeoutError) while a bulk copy saturated the network
        of the laptop; not counted. Its first rerun timed out the same way (parked); rerun again in
        robowits-lunaxh-limited-rerun-0929. The earlier round's trial stays in the raw records"}
    - {task: cover_with_lid, mode: limited, trial: robowits-cover-with-lid-i00-limi__cuGK2uH, note: "never reached the agent:
        the same setup timeout (AgentSetupTimeoutError); not counted. Parked, so no host shows it; rerun again in
        robowits-lunaxh-limited-rerun-0929"}
    # 2026-09-28 20:15, user: two unlimited trials ran on ws, an AMD host where the frozen instance is out of tolerance;
    # they are not counted (align_chopsticks is excluded from the benchmark instead: state/tasks/robowits.yml).
    not_counted:
    - {task: ball_into_jar, mode: unlimited, trial: robowits-ball-into-jar-i00__yezNVvJ, note: "run on an AMD host where
        the frozen instance is out of tolerance (instance_ok 0), so it could not be won; the instances were frozen on Intel"}
    - {task: differentiate_cubes, mode: unlimited, trial: robowits-differentiate-cubes-i00__SqEFYKE, note: "run on an AMD
        host where the frozen instance is out of tolerance (instance_ok 0), so it could not be won; the instances were
        frozen on Intel"}
    tasks:
    - align_blocks
    - align_chopsticks
    - balance_board
    - ball_into_bottle
    - ball_into_jar
    - ball_onto_tower
    - collect_screws
    - cover_with_lid
    - cylinder_through_hole
    - differentiate_cubes
    - dominos
    - gap_retrieve
    - hold_cup
    - move_cube
    - pinch_card
    - place_book
    - place_tall_box
    - raise_platform
    - retrieve_cube
    - retrieve_roll
    - roll_up_ball
    - round_dough_sheet
    - seal_colander
    - separate_marbles_and_sand
    - stabilize_bottle
    - stack_bowls
    - stack_cubes
    - stand_bulb
    - stand_pages
    - water_into_mug
  codex-gpt6_astra-high:
    batch: robowits-bel-astra-hi-1005
    tasks:
    - align_blocks
    - ball_into_bottle
    - ball_onto_tower
    - collect_screws
    - cover_with_lid
    - dominos
    - gap_retrieve
    - hold_cup
    - move_cube
    - raise_platform
    - retrieve_cube
    - stack_bowls
    - stand_bulb
    - stand_pages
    others: 'not run: the batch evaluation (2026-10-03 to 10-05) gave GPT-6 Astra the tasks GPT-6 Luna failed plus a stratified sample'
    closed: "the batch evaluation of 2026-10-03 to 10-05 is over; GPT-6 Astra ran the tasks and modes GPT-6 Luna failed, plus a stratified sample, so a mode it skipped reads not run"
  codex-gpt6_sol-high:
    batch: robowits-bel-sol-hi-1005
    tasks:
    - align_blocks
    - ball_into_bottle
    - collect_screws
    - cover_with_lid
    - dominos
    - gap_retrieve
    - hold_cup
    - raise_platform
    - retrieve_cube
    - stack_bowls
    - stand_pages
    others: 'not run (yet): the batch evaluation gave GPT-6 Sol a stratified sample and then the tasks GPT-6 Luna failed; it is still running'
  codex-gpt6_1_sol-high:
    batch: robowits-bel-sol61-hi-1005
    tasks:
    - align_blocks
    - ball_into_bottle
    - collect_screws
    - cover_with_lid
    - dominos
    - gap_retrieve
    - hold_cup
    - raise_platform
    - retrieve_cube
    - stack_bowls
    - stand_pages
    others: 'not run (yet): the batch evaluation gave GPT-6.1 Sol a stratified sample and then the tasks GPT-6 Luna failed; it is still running'
