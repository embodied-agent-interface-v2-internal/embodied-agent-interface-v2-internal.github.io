# MetaWorld+'s agent runs. Owned by the benchmark's owner, curated by hand like everything in state/.
# Format and field meanings: docs/contributing/registering-runs.md (and the header of state/runs/behavior-1k.yml).

default: codex-gpt6_luna-xhigh
# task id <task> -> our task directory metaworldplus-<task>-i00 (robot_coding_bench:
# metaworldplus-<task>-i00-privileged is the unlimited mode, its -standard twin the limited mode)
task_dir: "metaworldplus-{task_dashed}-i00"
# No partial credit beside success: the grader's final_reward is Meta-World's dense reward of the last step, not
# progress.
progress: none

# The sample model trial of robot_coding_bench PR #12 (2026-10-01): four tasks, one attempt per task and mode, 60
# minutes a mode. Codex CLI 0.159.3 as Harbor's own codex agent (`-a codex`), the owner's ChatGPT login
# (CODEX_FORCE_AUTH_JSON=1), no model gateway, agent egress allowlisted to the model APIs. The task names were renamed
# for protocol v1.0.1 after the trial (metaworldplus-<env>-i00 / -standard, now -privileged / -standard); scenes,
# instances, tests and solutions are unchanged. The Harbor jobs ran as one job per benchmark; they are filed here
# under the runner's per-task job names.
runs:
  codex-gpt6_luna-xhigh:
    batch: metaworldplus-lunaxh-1001
    rerun_batches: [metaworldplus-bel-luna-xh-1005]   # the batch evaluation of 2026-10-03 to 10-05 (protocol v1.0)
    harness: Codex CLI 0.159.3 as Harbor's codex agent (ChatGPT login, no model gateway)
    tasks:
    - assembly
    - door_open
    - handle_press
    - push
    - basketball
    - bin_picking
    - box_close
    - button_press
    - button_press_topdown
    - button_press_topdown_wall
    - button_press_wall
