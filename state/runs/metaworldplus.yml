# MetaWorld+'s agent runs. Owned by the benchmark's owner, curated by hand like everything in state/.
# Format and field meanings: docs/contributing/registering-runs.md (and the header of state/runs/behavior-1k.yml).

default: codex-gpt6_luna-high
# task id <family>_iNN -> its job's task directory metaworldplus-<family with dashes>-iNN. Our runner
# (robot_coding_bench scripts/metaworldplus/run_codex.py) names its Harbor jobs <mode>-<slug> under its experiment
# directory; robot_coding_bench scripts/site_media/link_site_jobs.py exposes the official trial of each task and mode as
# jobs/site-agents/<batch>-<mode>-metaworldplus-<family>-iNN/ (symlinks only), which is where scripts/import_runs.py looks.
task_dir: "metaworldplus-{task_dashed}"

# Our graders keep no partial credit: success (0 or 1) is the only score (MetaWorld's final_reward is the environment's dense reward, 0 to 10, not a fraction), so progress is success.
progress: success

runs:
  codex-gpt6_luna-high:
    # 2026-09-28 17:51-23:40 UTC: the whole suite, one formal attempt per instance and mode, 60 minutes each (Harbor
    # attempts 1, retries 0), 4 at a time after the first pair (robot_coding_bench
    # jobs/metaworldplus-codex-luna-high-60min-20260928T1717Z; acceptance, per-instance oracle/nop preflight and smoke
    # passed first). The limited mode of sweep_i00 was never started: its goal (the table's right edge) has no native
    # marker and the task sentence does not name it, so it is not evaluable without privileged state.
    batch: metaworldplus-lunahigh-0928
