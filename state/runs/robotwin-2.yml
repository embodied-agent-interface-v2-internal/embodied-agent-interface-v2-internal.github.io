# RoboTwin 2.0's agent runs. Owned by the benchmark's owner, curated by hand like everything in state/.
# Format and field meanings: docs/contributing/registering-runs.md (and the header of state/runs/behavior-1k.yml).
#
# The harness repo is robot_coding_bench (branch dev/kangrui): tasks robotwin_2_0_<task> (unlimited) and
# robotwin_2_0_<task>-limited (limited, robot as a service). Each batch is one Harbor job per mode with a trial per task;
# the limited mode's protocol changed twice, so the medium run's limited trials are three batches:
#   rcb-limited/1.0 (2026-09-23, /step with one action), 2.0 (2026-09-25, /submit action chunks + /observe, binary
#   RCB1 responses), 2.1 (2026-09-28, 2.0 + measured proprioception). The last one is the result; the earlier ones stay
#   as history. Codex CLI versions (Harbor installs the latest per trial): 0923 = 0.156.1, v20-0925 = 0.157.0,
#   xh-0927 = 0.157.1, v21-0928 = 0.158.0.

default: codex-gpt6_luna-xhigh
task_dir: "robotwin_2_0_{task}"

runs:
  codex-gpt6_luna-xhigh:
    batch: rt-luna-xh-0927
    # owner, 2026-09-29: one id for the configuration (harness, model, effort); RoboTwin ran it through Harbor's own agent
    harness: >-
      Since 2026-10-01 (batch rt-luna-xh-f1-1001, the official run): Harbor's built-in codex agent (-a codex, Codex CLI 0.159.0) on
      Azure OpenAI's API (gpt-6-luna), reasoning effort xhigh with detailed reasoning summaries, no model gateway (token
      counts are Harbor's per-trial totals); the tasks it has not reached yet still show the earlier result:       Harbor's built-in codex agent (-a codex; Codex CLI 0.157.1 limited, 0.158.0 unlimited) on the owner's ChatGPT login, not the CodexChatGPT
      wrapper the other benchmarks used: with the plain model id Codex applies ChatGPT's metadata for gpt-6-luna (its
      base instructions, verbosity low), and there is no model gateway (token counts are Harbor's per-trial totals)
    rerun_batches: [rt-luna-xh-rerun-0927, rt-luna-xh-f1-1001, robotwin-2-bel-luna-xh-1005]
    # Official batches from 2026-10-01 (protocol v1.0): Codex CLI 0.159.0 on Azure OpenAI's API (gpt-6-luna), reasoning
    # summaries detailed, sampled tasks in both modes (robot_coding_bench exps/formal_runs/codex-gpt6_luna-xhigh_batch*.json).
    # Each replaces, for its tasks, the earlier ChatGPT-login result, which stays as history (<mode>-prev).
    # unlimited added 2026-09-29 (Harbor job rt-gpt6luna-xhigh-unlimited, detailed reasoning summaries on), same batch id
    notes:
    # board 0108 (owner decisions B6 / B7, 2026-10-14): successes that used a reference value left on the env by the
    # eai-robotwin 0.1.1 scrub (board 0100 report §7; robot_coding_bench jobs-backup/robotwin-leak-b6-1014/manifest.json)
