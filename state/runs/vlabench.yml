    - {task: simple_seesaw_use, mode: limited, trial: vlabench-simple-seesaw-use-limit__3nEZnZq, note: "OpenRouter rejected the model requests for insufficient credits (the account ran out during the sweep), so no result was collected: no verdict on the agent; our own report counts it as not evaluated; rerun once with Codex + ChatGPT login (GPT-6 Luna, high) as the run codex-gpt6_luna-high"}
