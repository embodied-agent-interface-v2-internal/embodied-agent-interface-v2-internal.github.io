# VLABench's agent runs. Owned by the benchmark's owner, curated by hand like everything in state/.
# Format and field meanings: docs/contributing/registering-runs.md (and the header of state/runs/behavior-1k.yml).

default: terminus2-gpt6_luna-default
# task id = the native task name -> its job's task directory
# vlabench-<name with dashes>-i00. Our runners (robot_coding_bench scripts/vlabench/run_openrouter.py and
# scripts/vlabench/limited/run.py) kept their Harbor jobs per experiment; robot_coding_bench
# scripts/site_media/link_site_jobs.py exposes the official trial of each task and mode as
# jobs/site-agents/<batch>-<mode>-vlabench-<name>-i00/ (symlinks only), which is where scripts/import_runs.py looks.
task_dir: "vlabench-{task_dashed}-i00"

# Our graders keep no partial credit: success (0 or 1) is the only score (VLABench's graders write no final_reward), so progress is success.
progress: success

runs:
  terminus2-gpt6_luna-default:
    # 2026-09-24 (unlimited, 83 tasks) and 2026-09-24/25 (limited, 91 tasks): one formal attempt per task and mode,
    # 60 minutes each, 4 at a time, Harbor attempts 1 and retries 0 (robot_coding_bench
    # jobs/vlabench-unlimited-gpt-6-luna-60min-20260924 and jobs/vlabench-limited-gpt-6-luna-60min-20260924). The sensor-only
    # twins that run also covered are not on the site (owner, 2026-09-29). OpenRouter reported $5.50 (unlimited) and $592.26 (limited) for
    # the requests that returned usage; this harness keeps no gateway log, so the site shows only its list-price estimate.
    # Our own report counts an agent timeout as a timeout even where the verifier graded success, and a trial with no
    # verdict (API credits, a lost session, a missing instruction) as not evaluated: those trials carry a note here.
    batch: vlabench-terminus-0924
    closed: >-
      finished 2026-09-25: one formal attempt per task and mode
    notes:  # on one trial each, graded as it is: nothing arranged
    - {task: set_study_table, mode: unlimited, trial: vlabench-set-study-table-i00__YX9Fxzp, note: "the verifier graded the trajectory a success, but the agent hit the 60-minute limit (AgentTimeoutError) first; our own report counts this trial as a timeout"}
    - {task: cluster_drink, mode: limited, trial: vlabench-cluster-drink-limited60__w8c4hsk, note: "the agent's terminal session was lost mid-run, so no result was collected: no verdict on the agent; our own report counts it as not evaluated"}
    - {task: select_chemistry_tube_common_sense, mode: limited, trial: vlabench-select-chemistry-tube-c__tEyxfEM, note: "the episode reached native success and the verifier graded it a success, but the agent kept going until the 60-minute limit (AgentTimeoutError); our own report counts this trial as a timeout"}
    - {task: select_drink_common_sense, mode: limited, trial: vlabench-select-drink-common-sen__ao4tj6t, note: "the native task has no instruction text at this commit, so the agent was not told the goal; our own report counts it as not evaluated"}
    - {task: select_drink_semantic, mode: limited, trial: vlabench-select-drink-semantic-l__Mydgzzh, note: "the native task has no instruction text at this commit, so the agent was not told the goal; our own report counts it as not evaluated"}
    - {task: select_unique_type_mahjong, mode: limited, trial: vlabench-select-unique-type-mahj__cNmMSTn, note: "OpenRouter rejected the model requests for insufficient credits (the account ran out during the sweep), so no result was collected: no verdict on the agent; our own report counts it as not evaluated; rerun once with Codex + ChatGPT login (GPT-6 Luna, high) as the run codex-gpt6_luna-high"}
