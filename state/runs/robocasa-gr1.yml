# RoboCasa-GR1's agent runs. Owned by the benchmark's owner, curated by hand like everything in state/.
# Format and field meanings: docs/contributing/registering-runs.md (and the header of state/runs/behavior-1k.yml).

default: codex-gpt6_luna-xhigh
# task id <task> -> our task directory robocasa-gr1-<task>-i00 (robot_coding_bench: robocasa-gr1-<task>-i00-privileged
# is the unlimited mode, its -standard twin the limited mode)
task_dir: "robocasa-gr1-{task_dashed}-i00"
# No partial credit beside success: the grader's final_reward is the environment's last-step reward, not progress.
progress: none

# The sample model trial of robot_coding_bench PR #29 (2026-10-01): four tasks, one attempt per task and mode, 60
# minutes a mode. Codex CLI 0.159.3 (4 trials) and 0.160.0 (4 trials) as Harbor's own codex agent (`-a codex`), the
# owner's ChatGPT login (CODEX_FORCE_AUTH_JSON=1), no model gateway, agent egress allowlisted to the model APIs. After
# the trial the maintainer added the upstream success conditions to the instructions and fixed the hold-still wording
# (robot_coding_bench main, 2026-10-02); the agent saw the earlier wording. Scenes, instances, checks and reference
# solutions are unchanged. The Harbor jobs ran as one job per benchmark; they are filed here under the runner's
# per-task job names.
runs:
  codex-gpt6_luna-xhigh:
    batch: robocasa-gr1-lunaxh-1001
    rerun_batches: [robocasa-gr1-bel-luna-xh-1005]   # the batch evaluation of 2026-10-03 to 10-05 (protocol v1.0)
    harness: Codex CLI 0.159.3 (4 trials) and 0.160.0 (4 trials) as Harbor's codex agent (ChatGPT login, no model gateway)
    tasks:
    - bottle_to_cabinet_close
    - can_to_drawer_close
    - cuttingboard_to_basket
