# Curated task state for molmospaces.
#
# One block per task. Written by the site's Edit button and by hand; both are
# fine. Task ids match docs/benchmarks/molmospaces/tasks/<id>.md.
#
#   status      keep | drop | needs-review | pending
#   difficulty  unrated | easy | medium | hard | extreme
#   labels      tier-2 ids from state/taxonomy.yml
#   owner       bare GitHub handle
#   note        free text; why you decided what you decided
#
# Task id = the family with underscores (our task directory molmospaces-<family>-i00). The 8 tasks are the episodes
# robot_coding_bench keeps, one per family: of three candidates a fixed rule takes from each upstream package, the
# hardest and most representative in GPT-6 Luna's runs. Every one `keep`, its robot and why it was kept as the note
# (scripts/import_molmospaces_tasks.py adds a NEW task with `status: keep` and never changes an existing entry).
# Owner: williamzhangNU, who runs MolmoSpaces here. No difficulty or labels yet.

