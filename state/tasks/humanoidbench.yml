# Curated task state for humanoidbench.
#
# One block per task. Written by the site's Edit button and by hand; both are
# fine. Task ids match docs/benchmarks/humanoidbench/tasks/<id>.md.
#
#   status      keep | drop | needs-review | pending
#   difficulty  unrated | easy | medium | hard | extreme
#   labels      tier-2 ids from state/taxonomy.yml
#   display_tags  what the site shows: tag ids from state/display_tags.yml
#   owner       bare GitHub handle
#   note        free text; why you decided what you decided
#
# Task id = <category>_<task> (our task directory humanoidbench-<category>-<task>-i00). The 24 tasks are the ones
# robot_coding_bench's scripts/humanoidbench/subset.toml kept of HumanoidBench's 32: every one `keep`, its note the
# capability class it was kept for (scripts/import_humanoidbench_tasks.py adds a NEW task this way and never changes
# an existing entry). sit_simple is a fixture, not scored: `excluded`. Since 2026-10-06 the benchmark is one task per
# capability class, chosen without any model's results: a bar that measures the task and can be reached, then within
# a class upstream's hard version, more objects moved, the dexterous hands, the higher speed; the other 14 are
# `excluded` with the reason (docs/benchmarks/humanoidbench.md in robot_coding_bench). Owner:
# williamzhangNU, who runs HumanoidBench here. No difficulty or labels yet.

