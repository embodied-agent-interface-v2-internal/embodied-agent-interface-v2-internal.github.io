# Curated task state for vlabench.
#
# One block per task. Written by the site's Edit button and by hand; both are
# fine. Task ids match docs/benchmarks/vlabench/tasks/<id>.md.
#
#   status      keep | drop | needs-review | pending
#   difficulty  unrated | easy | medium | hard | extreme
#   labels      tier-2 ids from state/taxonomy.yml
#   owner       bare GitHub handle
#   note        free text; why you decided what you decided
#
# Task id = VLABench's native task name (our task directory vlabench-<name>-i00).
# labels (2026-09-29): from each task's instruction and its definition at the pinned commit (conditions and expert
# skill sequence in VLABench/tasks/hierarchical_tasks); gen-fixed because every task is one frozen instance. A task
# with no instruction at this commit is labelled from its registration and source, and its note says so. No
# difficulty or triage yet.

