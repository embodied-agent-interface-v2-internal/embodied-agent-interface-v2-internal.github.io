  - articulated
  - force
  - horizon-composite
  - gen-layout
  note: 'Integrated in robot_coding_bench (tasks/robotwin_2_0_open_microwave, seed 28831) and validated:
    Harbor oracle 1 / nop 0, replay bit-exact. Keep — core. The one task where RoboTwin''s own expert
    needs a loop: it re-grasps along contact points on the door up to 50 times, has a fallback strategy
    when the door stalls, and still fails on 3 of 6 uncommon seeds (7k-10k physics steps when it succeeds).
    Predicate is the hinge joint at >= 60% of its range, so the agent must reason about the door''s kinematics
    (get_qpos / get_qlimits) rather than a pose. No model run yet.'
  owner: JamesKrW
  status: keep
  tags:
  - rcb-integrated
