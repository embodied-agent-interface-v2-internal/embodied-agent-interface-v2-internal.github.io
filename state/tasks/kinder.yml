# Curated task state for kinder.
#
# One block per task. Written by the site's Edit button and by hand; both are
# fine. Task ids match docs/benchmarks/kinder/tasks/<id>.md.
#
#   status      keep | drop | needs-review | pending
#   difficulty  unrated | easy | medium | hard | extreme
#   labels      tier-2 ids from state/taxonomy.yml
#   owner       bare GitHub handle
#   note        free text; why you decided what you decided
#
# Task id = the family with underscores (our task directory kinder-<family>-i00). The 11 tasks are the ones
# robot_coding_bench's scripts/kinder/subset.toml keeps of KinDER's 31 families, one variant each: every one `keep`,
# its note why it was kept (the six Dynamic3D tasks whose goal a camera can see or a sentence can name, or the
# screening of every other family, which GPT-6 Luna failed in limited mode) and the KinDER paper's challenges for its
# family (scripts/import_kinder_tasks.py adds a NEW task with `status: keep` and never changes an existing entry).
# dynamo is a fixture, not scored: `excluded`. Owner: williamzhangNU, who runs KinDER here. No difficulty or labels yet.

