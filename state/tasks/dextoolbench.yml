# Curated task state for dextoolbench.
#
# One block per task. Written by the site's Edit button and by hand; both are
# fine. Task ids match docs/benchmarks/dextoolbench/tasks/<id>.md.
#
#   status      keep | drop | needs-review | pending
#   difficulty  unrated | easy | medium | hard | extreme
#   labels      tier-2 ids from state/taxonomy.yml
#   owner       bare GitHub handle
#   note        free text; why you decided what you decided
#
# First pass 2026-09-29 by Claude for the owner: labels by the guide's test (required by the goal, not visible in the
# demo); difficulty from the oracle's and the agent's results; status left pending (triage is the owner's call).

brush_blue_brush_sweep_forward:
  difficulty: extreme
  labels:
  - scale-tabletop
  - transport
  - horizon-composite
  - ordered
  - gen-fixed
  note: 'Goals are tool poses (34, in order); the score never looks at the tool''s effect on the nail, board or
    plate, so tool-use and surface-treatment are not labelled. gen-fixed: one start pose and one goal trajectory
    per task. Difficulty ''extreme'' from evidence: oracle (SimToolReal''s RL policy, our port) 8/34 goals; Codex
    + GPT-6 Luna xhigh unlimited 0/34 goals, limited (no per-goal limit) 0 goals.'
