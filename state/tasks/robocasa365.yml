# Curated task state for robocasa365.
#
# One block per task. Written by the site's Edit button and by hand; both are
# fine. Task ids match docs/benchmarks/robocasa365/tasks/<id>.md.
#
#   status      keep | drop | needs-review | pending
#   difficulty  unrated | easy | medium | hard | extreme
#   labels      tier-2 ids from state/taxonomy.yml
#   display_tags  what the site shows: tag ids from state/display_tags.yml
#   owner       bare GitHub handle
#   note        free text; why you decided what you decided
#
# Task id = the task part of our task pairs in robot_coding_bench (tasks/<prefix>-<task>-i00-privileged and -standard),
# with underscores. Every task here is one robot_coding_bench keeps, so each is `keep`, with its category as the note
# (scripts/import_robocasa365_tasks.py adds a NEW task that way and never changes an existing entry).
# Owner: changhechen, who built the selection. No difficulty or labels yet.

