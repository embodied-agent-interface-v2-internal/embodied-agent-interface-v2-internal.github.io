# Curated task state for robopaint-strict.
#
# One block per task. Written by the site's Edit button and by hand; both are
# fine. Task ids match docs/benchmarks/robopaint-strict/tasks/<id>.md.
#
#   status      keep | drop | needs-review | pending
#   difficulty  unrated | easy | medium | hard | extreme
#   labels      tier-2 ids from state/taxonomy.yml
#   display_tags  what the site shows: tag ids from state/display_tags.yml
#   owner       bare GitHub handle
#   note        free text; why you decided what you decided
#
# RoboPaint-strict is RoboPaint's 82 brush targets with process rules added to the verifier (a benchmark of its own
# since 2026-10-06, owner: "split everywhere"). Task id = <family>_<target>, as in RoboPaint (our task directories
# robopaint-strict-<family>-<target>-i00-privileged / -standard). difficulty: from each task's task.toml
# (scripts/import_robopaint_tasks.py --benchmark robopaint-strict adds it for a NEW task and never changes an existing
# one); display_tags: copied from the same task in state/tasks/robopaint.yml when the benchmark was added.

