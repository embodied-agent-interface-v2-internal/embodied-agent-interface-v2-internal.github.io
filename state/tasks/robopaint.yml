# Curated task state for robopaint.
#
# One block per task. Written by the site's Edit button and by hand; both are
# fine. Task ids match docs/benchmarks/robopaint/tasks/<id>.md.
#
#   status      keep | drop | needs-review | pending
#   difficulty  unrated | easy | medium | hard | extreme
#   labels      tier-2 ids from state/taxonomy.yml
#   owner       bare GitHub handle
#   note        free text; why you decided what you decided
#
# Task id = <family>_<target> (our task directory robopaint-<family>-<target>-i00, since 2026-09-28; before
# that the benchmark was maniskill-paint and a task was only its target, e.g. `butterfly`).
# difficulty: from each task's task.toml; scripts/import_robopaint_tasks.py adds it for a NEW task and never changes
# an existing one. Line drawings are all easy (user 2026-09-27 21:10: "简笔画应该全部归类为 easy"; the drawing's
# own level stays in the page's upstream block as `line_complexity`). No labels yet (user 2026-09-27: "taxonomy 先不管").
# excluded: why a task is not part of the final benchmark; the task stays on the site, greyed and last in every list,
# its runs in Runs (not the review `status`, which other benchmarks use for drop). All 9 line drawings are excluded
# since 2026-09-28 04:30, the owner: "放到展示的最下面，同时在 benchmark 里面都灰掉. 最终的 benchmark 我们可能不会 include
# 简笔画" and "我们仍然可以在 runs…去展示它，毕竟我们跑过…不需要丢掉". Keep notes in this block: the Edit button keeps it.

