# Curated task state for metaworldplus.
#
# One block per task. Written by the site's Edit button and by hand; both are
# fine. Task ids match docs/benchmarks/metaworldplus/tasks/<id>.md.
#
#   status      keep | drop | needs-review | pending
#   difficulty  unrated | easy | medium | hard | extreme
#   labels      tier-2 ids from state/taxonomy.yml
#   owner       bare GitHub handle
#   note        free text; why you decided what you decided
#
# Task id = <family>_iNN (our task directory metaworldplus-<environment>-privileged-iNN).
# labels (2026-09-29): what each environment's native success condition requires, read from the pinned upstream
# source (every instance of an environment shares them); gen-fixed because every task is one frozen instance. No
# difficulty or triage yet: upstream Meta-World publishes no per-task difficulty, and none has been decided here.

