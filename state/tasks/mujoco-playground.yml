# Curated task state for mujoco-playground.
#
# One block per task. Written by the site's Edit button and by hand; both are
# fine. Task ids match docs/benchmarks/mujoco-playground/tasks/<id>.md.
#
#   status      keep | drop | needs-review | pending
#   difficulty  unrated | easy | medium | hard | extreme
#   labels      tier-2 ids from state/taxonomy.yml
#   owner       bare GitHub handle
#   note        free text; why you decided what you decided
#
# First pass 2026-09-29 by Claude for the owner: labels by the guide's test (required by the goal, not visible in the
# demo); difficulty from the oracle's and the agent's results; status left pending (triage is the owner's call).

aero_cube_rotate_z_axis:
  difficulty: extreme
  labels:
  - scale-tabletop
  - in-hand
  - dynamics
  - horizon-atomic
  - gen-layout
  note: 'Same as leap_cube_rotate_z_axis on the TetherIA Aero hand. RL-policy only upstream; not built. gen-layout:
    Playground randomizes the start per episode (our tasks freeze one seed).'
  owner: JamesKrW
  status: pending
aloha_hand_over:
  difficulty: hard
  labels:
  - scale-tabletop
  - bimanual
  - transport
  - horizon-composite
  - gen-layout
  note: 'bimanual: the left arm must pass the box to the right arm, which alone holds it at the target (the left
    may not touch it at the end). composite: pick, hand over, place. Evidence: our scripted oracle succeeds; Codex
    + GPT-6 Luna xhigh unlimited succeeded, limited failed. gen-layout: Playground randomizes the start per episode
    (our tasks freeze one seed).'
  owner: JamesKrW
  status: pending
aloha_single_peg_insertion:
  difficulty: hard
  labels:
  - scale-tabletop
  - bimanual
  - transport
  - precision-fit
  - horizon-composite
  - gen-layout
  note: 'bimanual: one arm holds the socket, the other the peg, both lifted. precision-fit: the tip within 5 mm
    of the socket axis, 25 % of the depth inside. Evidence: scripted oracle succeeds; the agent succeeded in the
    pilot, failed in the main run (unlimited, 60 min timeout) and in limited. gen-layout: Playground randomizes
    the start per episode (our tasks freeze one seed).'
  owner: JamesKrW
  status: pending
