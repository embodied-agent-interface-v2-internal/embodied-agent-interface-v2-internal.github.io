  note: 'Integrated in robot_coding_bench (tasks/robolab-banana-in-bowl-i00) and validated
    end to end: Harbor oracle 1 / nop 0, 177 actions, four independent processes agree
    on the final state. The demo on this page is that reference solution, not an upstream
    clip. Harder than it looks for a scripted agent: the banana''s pose centre lies
    in the concavity of the curve, so a grasp planned from the bounding box closes
    on air, and the Robotiq pads reach only 5.7 cm back from the fingertips.'
  skills:
  - semantics
  tags:
  - rcb-integrated
