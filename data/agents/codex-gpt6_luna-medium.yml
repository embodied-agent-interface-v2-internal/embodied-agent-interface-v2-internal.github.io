# One agent run: harness + model + settings. The file name is the run id that state/runs/<benchmark>.yml refers to.
# Run id <harness>-<model>-<effort> (docs/contributing/registering-runs.md).
#
# Read by the tooling: label, short, billing, price, modes. Everything else is for people.

label: Codex + GPT-6 Luna, reasoning medium (ChatGPT login)
short: Codex · GPT-6 Luna · medium · ChatGPT login
harness_id: codex
harness: >-
  Harbor's built-in codex agent (-a codex) on the owner's ChatGPT login (CODEX_FORCE_AUTH_JSON=1). Harbor installs the
  latest Codex CLI per trial, so the version varies by batch (0.156.1 to 0.158.0; each batch's version is in
  state/runs/<benchmark>.yml). Unlike harbor_agents.codex_chatgpt:CodexChatGPT (run codex-gpt6_luna-xhigh),
  the model id is plain gpt-6-luna, so Codex applies ChatGPT's own metadata for it (its base instructions, verbosity
  low), and there is no model gateway: token counts are Harbor's per-trial totals.
route: the owner's ChatGPT login (a Pro subscription), Codex straight to ChatGPT's backend (no model gateway)
model: openai/gpt-6-luna
settings:
  reasoning_effort: medium
harbor: >-
  CODEX_FORCE_AUTH_JSON=1 harbor run -a codex -m openai/gpt-6-luna --ak reasoning_effort=medium -n 3 (one Harbor job per
  mode, a trial per task)
billing: subscription           # the owner's ChatGPT login: no per-token bill, so only the list-price estimate
price: openai/gpt-6-luna        # key in data/prices.yml
modes: [unlimited, limited]
since: 2026-09-23
