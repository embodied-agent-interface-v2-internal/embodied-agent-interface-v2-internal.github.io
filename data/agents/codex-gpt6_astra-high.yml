# One agent run: harness + model + settings. The file name is the run id that state/runs/<benchmark>.yml refers to:
# <harness>-<model>-<effort>[-<tag>], spelled by harness_id, the model's id in data/prices.yml, settings.reasoning_effort
# and tag (docs/contributing/registering-runs.md). Registered once, reused by every benchmark that runs this configuration.
#
# Read by the tooling: label, short, billing, price, modes, harness_id, tag, formerly. Everything else is for people.

label: Codex + GPT-6 Astra, reasoning high (ChatGPT login + Azure)
short: Codex · GPT-6 Astra · high · ChatGPT login + Azure
harness_id: codex
harness: >-
  Codex CLI 0.160.0 as Harbor's own codex agent (`-a codex`, robot_coding_bench scripts/run_agent_batch.sh, protocol
  v1.0), web search off, the agent's egress allowlisted to the model APIs, every request through our model gateway
route: the owner's ChatGPT Pro subscriptions (365 trials) and Azure OpenAI deployments (213), through our model gateway
model: openai/gpt-6-astra
settings:
  reasoning_effort: high
  version: 0.160.0
harbor: >-
  AGENT=codex MODEL=openai/gpt-6-astra EFFORT=high GATEWAY=1 scripts/run_agent_batch.sh (one Harbor job per task and mode,
  dispatched by our batch scheduler across the lab's and AWS machines)
billing: subscription
price: openai/gpt-6-astra
modes: [unlimited, limited]
since: 2026-10-03
notes: >-
  Batch evaluation of 2026-10-03 to 10-05 on robot_coding_bench main (protocol v1.0): the privileged task is the
  unlimited mode, its standard twin the limited mode. Azure trials that died on Azure's 50-images-per-request cap were rerun on the subscriptions.
