# What we run it on, and what that costs: measured on an RTX 4090 workstation (the GPU is not used).
integration:
  image: our Meta-World image (1.1 GB; Python 3.11, MuJoCo 3.3.0, CPU OSMesa rendering), built locally
  containers: >-
    unlimited: main (the agent with the privileged runtime; reset as often as it likes) + a credential-free egress
    proxy; limited: main (a four-endpoint client only) + sim (the simulator, the instance and the sealed record) +
    the egress proxy; the verifier runs in its own container
  physics_backend: MuJoCo on the CPU; rendering OSMesa on the CPU
  determinism: bit-exact across fresh processes (live run == two fresh-process replays, full-state hash)
  licence: Meta-World is MIT licensed
