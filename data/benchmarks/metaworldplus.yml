id: metaworldplus
name: MetaWorld+
edition: upstream Meta-World 3.1.1 (Farama-Foundation/Metaworld @ 59fc34d), v3 environments with reward v2; our frozen instances (2026-09-21)
status: active
simulator: MuJoCo 3.3.0 (Meta-World 3.1.1)
description: >-
  Every environment of Meta-World's v3 set (50, the full ENV_CLS_MAP at the pinned commit) on the Sawyer arm, as 70
  frozen instances: one per environment, three for ten of them. "MetaWorld+" is our suite's name; the installed
  package is upstream Meta-World, with no separate "+" release. Each instance is frozen whole (MuJoCo state, model
  arrays, task caches and RNG, never a seed-only restore) and replays bit-exactly in fresh processes. Success is the
  environment's own success flag, attained at any control of the trajectory, as upstream evaluates it.

links:
  repository: https://github.com/Farama-Foundation/Metaworld
  pinned_commit: https://github.com/Farama-Foundation/Metaworld/tree/59fc34d7768af9785e4688c3e1db671424f4a6c3
  documentation: https://metaworld.farama.org/
  paper: https://arxiv.org/abs/1910.10897

embodiment:
  robot: Rethink Sawyer (7-DoF arm, fixed base) with a two-finger gripper; the wrist is fixed
  dof: 3 (Cartesian) + gripper
  control_modes: [mocap XYZ displacement + gripper]
  control_rate_hz: 80
  observations: [privileged state (unlimited), rgb-d + calibration + proprioception (limited)]
  cameras:
    topview / corner / corner2 / corner3 / corner4: fixed, 480x480
    behindGripper / gripperPOV: on the hand
  notes: >-
    An action is [dx, dy, dz, grip] in [-1, 1]: the hand controller's target moves 0.01 m per unit (clipped to the
    environment's mocap bounds) and the hand follows; grip +1 closes. Each control runs 5 physics steps of 2.5 ms.
    An episode is at most 500 controls (6.25 s simulated), upstream's max_path_length.

# Meta-World publishes no per-task skill annotation, so `skills:` cannot be validated.
skill_vocabulary: []

