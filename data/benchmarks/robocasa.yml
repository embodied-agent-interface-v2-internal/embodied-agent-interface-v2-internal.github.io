id: robocasa
name: RoboCasa
edition: RoboCasa v0.2 @ 756598a, our selection of 29 tasks (robot_coding_bench @ 8c5594a43)
status: active
simulator: robosuite 1.5.1 / MuJoCo 3.2.6 (RoboCasa v0.2)
description: >-
  Everyday kitchen tasks for a mobile manipulator in large procedurally generated kitchens: opening and closing doors
  and drawers, turning knobs and faucets, pressing buttons, and picking and placing between counters, cabinets, sinks,
  stoves and appliances, single- and multi-stage. We keep the 29 tasks with an official demonstration at the pinned
  commit whose demonstration re-verifies as a reference on a frozen instance (its first episode's initial state). Each
  task passes or fails on the environment's own success check on the state after the last action, with no partial
  credit, and runs in two modes: unlimited (privileged: full simulator state, unlimited resets, one replayable
  trajectory handed in) and limited (standard: the robot's own four cameras, one episode, no reset).

links:
  repository: https://github.com/robocasa/robocasa
  paper: https://arxiv.org/abs/2406.02523

embodiment:
  robot: Franka Panda on an Omron mobile base with a torso lift (PandaOmron)
  action_space: "the robot's native composite-controller command, 12 numbers per control step: arm end-effector deltas (OSC), gripper, base velocity, torso, and the base/arm mode"
  control_rate_hz: 20
  observations: [proprioception, rgb, depth]
  cameras:
    robot0_agentview_center, left, right: RGB-D, on the robot
    robot0_eye_in_hand: RGB-D, on the hand
  notes: >-
    Unlimited: the agent drives the environment in Python with the whole simulator state. Limited: the simulator runs in
    a service; the agent sees the robot's own cameras (with the current calibration, since they move with the robot),
    its joints, its end-effector position and last command, and the task's language; never an object's pose, the kitchen
    layout or the success check.

# robot_coding_bench publishes no skill vocabulary for RoboCasa, so `skills:` cannot be validated.
skill_vocabulary: []

# One scene model for the whole benchmark (scripts/import_robocasa_tasks.py sets it).
scenes:
  - robocasa_kitchen

# What we run it on: robot_coding_bench's task pairs, measured on an AMD Ryzen 9 7950X workstation.
integration:
  image: ghcr.io/mll-lab-nu/eai-robocasa:0.1.0 (RoboCasa @ 756598a; demonstrations and their links removed), CPU only, ~24 GB
  containers: >-
    unlimited (privileged): main (the agent with the simulator) + the verifier's own sandbox, which replays
    the trajectory twice in fresh processes. limited (standard): main (the agent: an HTTP client only) + sim
    (the simulator and the recording; the agent reaches it only through the client) + the verifier's own
    sandbox. The agent reaches the model APIs and nothing else.
  physics_backend: MuJoCo on the CPU; OSMesa renders the cameras
  determinism: bit-exact across fresh processes (both replays of a trajectory end in the same state)
  licence: RoboCasa is MIT; its assets carry their own licences (some CC-BY-NC-4.0)
