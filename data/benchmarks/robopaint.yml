id: robopaint
name: RoboPaint
edition: ours (2026-09-28)
status: active
simulator: ManiSkill 3.0.1 / SAPIEN 3.0.3 + Spline-FRIDA stroke model
description: >-
  Our embodied painting benchmark: a Franka Panda holding a brush paints the picture it is given
  (an RGB image, never a vector file) onto a sheet of paper, fetching paint from a 5-colour
  palette. ManiSkill simulates the robot; Spline-FRIDA's learned brush-stroke model (CMU's FRIDA
  robot painter) turns the path the brush tip actually took into paint. Task families: lettering,
  kaishu and xingshu calligraphy, acrylic and oil painting, each scored against the picture by the
  graders. The line drawings (easy) are excluded from the final benchmark and kept for the record.

links:
  maniskill: https://github.com/haosulab/ManiSkill
  frida: https://github.com/cmubig/Frida/tree/spline-frida-z-master-resolved
  spline_frida_paper: https://arxiv.org/abs/2412.00597

embodiment:
  robot: Franka Panda with a brush (ManiSkill's PandaStick; rigid handle + 12 mm soft bristle tuft)
  dof: 7
  control_modes: [pd_joint_pos, ee_pose (limited mode)]
  control_rate_hz: 20
  observations: [rgb, proprioception]
  cameras:
    canvas_cam: 512x512, overhead
    scene_cam: ManiSkill DrawSVG's view
    side_cam: grazing view of the brush height
  notes: >-
    Fixed base at a table; paper 227 mm square; palette plate beside it with black, red, blue,
    yellow and green wells. The brush starts dry; dipping into a well loads that paint.
    Pressure sets the line width (about 2.2 mm at a light touch to 7.5 mm).

# Our own benchmark: no published skill vocabulary, so `skills:` cannot be validated.
skill_vocabulary: []

# One "scene" per task family (scripts/import_robopaint_tasks.py sets scene_model = robopaint_<family>), so the task
# list's Scene filter picks a family.
scenes:
  - robopaint_line
  - robopaint_lettering
  - robopaint_kaishu
  - robopaint_xingshu
  - robopaint_acrylic
  - robopaint_oil

# What we run it on, and what that costs: measured on an RTX 4090 workstation.
integration:
  image: our RoboPaint image (2.5 GB; ManiSkill + FRIDA @ 1652973, torch on the CPU)
  containers: >-
    main (the agent: the tooling, the scene, the picture) + scorer (the scoring service with the graders' copy of the
    instance; the agent reaches it only through s.score()) + the verifier's own sandbox
  physics_backend: PhysX on the CPU; the paint model on the CPU; Vulkan (GPU) only for cameras
  determinism: bit-exact across fresh processes (live run == two fresh-process replays)
  licence: >-
    FRIDA (code and brush weights) is GPL-3.0, shipped unmodified inside the locally built image;
    the targets are ours (CC0).
