id: robopaint-strict
name: RoboPaint-strict
edition: ours (2026-10-05)
status: active
simulator: ManiSkill 3.0.1 / SAPIEN 3.0.3 + brush models (calligraphy, broad nib, libmypaint 1.6.1)
description: >-
  RoboPaint's 82 brush targets (kaishu 35, xingshu 16, lettering 10, acrylic 10, oil 11; both modes) with
  process rules added to the verifier: the exemplar has to be written or painted with strokes, the way a
  person does, not coloured in. Writing fails when a long brush-tip path is made of thin marks (colouring in
  with a thin line); a painting has a path budget and its strokes must be sweeps, not zigzag, serpentine or
  contour-offset fills. Success is RoboPaint's picture rule and the process rules; rule-abiding work keeps
  RoboPaint's continuous score. A benchmark of its own: RoboPaint's tasks and results stay as they are, and a
  RoboPaint trajectory is graded by the strict verifier as it is, so the two compare one to one.

links:
  maniskill: https://github.com/haosulab/ManiSkill
  libmypaint: https://github.com/mypaint/libmypaint

embodiment:
  robot: Franka Panda with a brush or pen (ManiSkill's PandaStick; rigid handle + soft tuft or nib)
  dof: 7
  control_modes: [joint_position, ee_pose]
  control_rate_hz: 20
  observations: [rgb, proprioception]
  cameras:
    canvas_cam: overhead, the main sheet
    practice_cam: the practice sheet
    scene_cam: the scene
    side_cam: grazing view of the brush height
  notes: >-
    RoboPaint's scene, frozen instance, picture, tooling and reference solution, unchanged: a main sheet and a
    practice sheet (practice strokes are free), an ink stone or paint wells, 7200 s of wall clock per mode. The
    rules are added to the instance's success rule, and the graders' tooling (rcb_brush_strict.py) measures the
    strokes themselves: path_mm, the brush tip's path pressed on the main sheet with paint; mark_width_mm, the
    marks' average width; scribble_share, the share of the path in strokes much longer than their bounding box.

# Our own benchmark: no published skill vocabulary, so `skills:` cannot be validated.
skill_vocabulary: []

# One "scene" per task family (scripts/import_robopaint_tasks.py sets scene_model = robopaint_<family>), so the task
# list's Scene filter picks a family. No line drawings: RoboPaint-strict has only the brush families.
scenes:
  - robopaint_lettering
  - robopaint_kaishu
  - robopaint_xingshu
  - robopaint_acrylic
  - robopaint_oil

integration:
  image: our RoboPaint image (eai-robopaint 0.2.0; ManiSkill 3.0.1, SAPIEN 3.0.3, a patched libmypaint 1.6.1)
  containers: >-
    main (the agent: RoboPaint's tooling, the scene, the picture) + scorer (the scoring service with the graders'
    copy of the instance and the strict rules; the agent reaches it only through s.score()) + the verifier's own sandbox
  determinism: bit-exact across fresh processes (live run == two fresh-process replays)
  licence: >-
    libmypaint is ISC (patched), mypaint-brushes CC0-1.0; the targets are ours (CC0) or public-domain works.
