# The public build's settings: `make public`, which .github/workflows/deploy.yml publishes (scripts/sitemode.py).

# Benchmarks whose demos the public site links to the official video instead of carrying our copies. GitHub Pages
# publishes at most 1 GB, and BEHAVIOR-1K's 98 copies alone are 1.1 GB (owners' decision, 2026-09-28: option A).
link_demos: [behavior-1k]

# Where the agent runs' replays and images are hosted, outside GitHub Pages: the Hugging Face dataset
# eai-v2-internal/agent-runs (make upload-run-media; its card: data/run-media-card.md). A log page loads
# <run_media_base><benchmark>/<run>/<task>/<slot>/<file>. Empty: the log pages say "media not yet published".
run_media_base: "https://huggingface.co/datasets/eai-v2-internal/agent-runs/resolve/main/"

# The format the PNG images are published in (scripts/compress_run_media.py converts them; scripts/publish_runs.py
# names them so in the snapshot). JPEG images and the MP4 replays keep their names.
run_media_images: webp
